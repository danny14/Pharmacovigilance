services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmacovigilance_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: pharmacovigilance_db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: pharmacovigilance_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pharmacovigilance_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_PASSWORD: rootpassword
    volumes:
      - pharmacovigilance_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-prootpassword"]
      retries: 3
      timeout: 5s

volumes:
  pharmacovigilance_mysql_data:
